name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and build
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name BoardGameHost `
            --add-data "boardgame_platform/web;boardgame_platform/web" `
            --hidden-import boardgame_platform.games.tictactoe `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            packaging/run_host.py
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name BoardGameClient `
            --hidden-import boardgame_platform.games.tictactoe `
            packaging/run_client.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boardgame-windows-exe
          path: |
            dist/BoardGameHost.exe
            dist/BoardGameClient.exe

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BoardGameHost.exe
            dist/BoardGameClient.exe
