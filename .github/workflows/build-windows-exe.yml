name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and build
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name BoardGameHost `
            --add-data "boardgame_platform/web;boardgame_platform/web" `
            --hidden-import boardgame_platform.games.tictactoe `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            packaging/run_host.py
          if (-not (Test-Path dist/BoardGameHost.exe)) { throw "BoardGameHost.exe missing" }
          Get-ChildItem dist/*.exe | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: boardgame-windows-host
          path: dist/BoardGameHost.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BoardGameHost.exe
